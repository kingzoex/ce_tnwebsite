<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="ceGold" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </radialGradient>
    <linearGradient id="ceBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="ceGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Glow Ring -->
  <circle cx="60" cy="60" r="58" fill="none" stroke="url(#ceGold)" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Outer Oval Shield -->
  <ellipse cx="60" cy="60" rx="54" ry="46" fill="url(#ceBlue)" stroke="url(#ceGold)" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- Inner Golden Beaded / Rope Border -->
  <ellipse cx="60" cy="60" rx="48" ry="40" fill="none" stroke="url(#ceGold)" stroke-width="1.2" stroke-dasharray="2,2"/>
  
  <!-- Rays of Light -->
  <g opacity="0.3" stroke="url(#ceGold)" stroke-width="1">
    <line x1="60" y1="22" x2="60" y2="40"/>
    <line x1="45" y1="26" x2="52" y2="42"/>
    <line x1="75" y1="26" x2="68" y2="42"/>
    <line x1="32" y1="38" x2="48" y2="48"/>
    <line x1="88" y1="38" x2="72" y2="48"/>
  </g>

  <!-- Golden Dove (Holy Spirit) -->
  <path d="M60 32 C58 28, 52 30, 48 34 C53 36, 56 36, 58 38 C54 40, 52 44, 55 45 C58 44, 59 41, 60 40 C61 41, 62 44, 65 45 C68 44, 66 40, 62 38 C64 36, 67 36, 72 34 C68 30, 62 28, 60 32 Z" fill="url(#ceGold)"/>

  <!-- Cross -->
  <rect x="58" y="42" width="4" height="26" rx="1" fill="url(#ceGold)"/>
  <rect x="51" y="48" width="18" height="4" rx="1" fill="url(#ceGold)"/>

  <!-- Open Bible -->
  <path d="M42 66 C48 64, 55 64, 60 67 C65 64, 72 64, 78 66 L78 78 C72 76, 65 76, 60 79 C55 76, 48 76, 42 78 Z" fill="#FFFFFF" opacity="0.95"/>
  <path d="M60 67 L60 79" stroke="#996515" stroke-width="1"/>
  <path d="M44 68 C49 67, 54 67, 58 69" stroke="#CBD5E1" stroke-width="0.8" fill="none"/>
  <path d="M62 69 C66 67, 71 67, 76 68" stroke="#CBD5E1" stroke-width="0.8" fill="none"/>
  <path d="M44 71 C49 70, 54 70, 58 72" stroke="#CBD5E1" stroke-width="0.8" fill="none"/>
  <path d="M62 72 C66 70, 71 70, 76 71" stroke="#CBD5E1" stroke-width="0.8" fill="none"/>

  <!-- Banner Ribbon for "CHRIST EMBASSY" -->
  <path d="M30 84 Q60 92 90 84 Q92 88 88 92 Q60 99 32 92 Q28 88 30 84 Z" fill="url(#ceGold)"/>
  <text x="60" y="90" font-family="'Times New Roman', serif" font-weight="bold" font-size="6.5" fill="#0A0E1A" text-anchor="middle" letter-spacing="1">CHRIST EMBASSY</text>
</svg>
